<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AMA - دخول / إنشاء حساب</title>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    :root{
      --color-primary: #FF9500;
      --color-light1: #FFF2C9;
      --color-light2: #C3D2AE;
      --color-mid1: #8DB19B;
      --color-mid2: #618E89;
      --color-dark1: #426B73;
      --color-dark2: #2F4858;
      --text: #2c3e50;
      --text-light: #7f8c8d;
      --text-muted: #95a5a6;
      --white: #ffffff;
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
      --shadow-lg: 0 20px 50px rgba(0,0,0,0.15);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'IBM Plex Sans Arabic',sans-serif;
      background:linear-gradient(135deg, var(--color-light1) 0%, rgba(195, 210, 174, 0.3) 100%);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:450px;
      background:var(--white);
      border-radius:20px;
      padding:40px;
      box-shadow:var(--shadow-lg);
      animation:slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo{
      text-align:center;
      margin-bottom:30px;
    }

    .logo-wrapper{
      width:100px;
      height:100px;
      margin:0 auto 20px;
      background:linear-gradient(135deg, var(--color-primary), var(--color-mid1));
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:var(--shadow);
    }

    .logo img{
      width:80px;
      height:80px;
      object-fit:contain;
      border-radius:50%;
    }

    .logo h1{
      font-size:32px;
      background:linear-gradient(135deg, var(--color-primary), var(--color-mid1));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      font-weight:700;
    }

    .logo p{
      color:var(--text-light);
      margin-top:8px;
      font-size:14px;
    }

    .tabs{
      display:flex;
      gap:10px;
      margin-bottom:30px;
      background:linear-gradient(90deg, var(--color-light1), var(--color-light2));
      padding:4px;
      border-radius:12px;
    }

    .tabs button{
      flex:1;
      padding:12px;
      border:none;
      border-radius:10px;
      background:transparent;
      color:var(--text-light);
      cursor:pointer;
      font-weight:700;
      transition:all 0.3s ease;
      font-size:14px;
    }

    .tabs button.active{
      background:var(--white);
      color:var(--color-primary);
      box-shadow:var(--shadow);
    }

    .card{
      background:var(--white);
      border-radius:16px;
      padding:0;
    }

    .hidden{
      display:none;
    }

    .field{
      margin-bottom:20px;
    }

    .field label{
      display:block;
      margin-bottom:8px;
      color:var(--text);
      font-size:13px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    .field input{
      width:100%;
      padding:14px;
      border-radius:10px;
      border:2px solid var(--color-light2);
      background:var(--white);
      color:var(--text);
      outline:none;
      direction:ltr;
      transition:all 0.3s ease;
      font-size:14px;
    }

    .field input:focus{
      border-color:var(--color-primary);
      background:rgba(255, 149, 0, 0.05);
      box-shadow:0 0 0 3px rgba(255, 149, 0, 0.1);
    }

    .btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:linear-gradient(135deg, var(--color-primary), var(--color-mid1));
      color:white;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      margin-top:10px;
      transition:all 0.3s ease;
      box-shadow:var(--shadow);
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 15px 35px rgba(255, 149, 0, 0.4);
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .message{
      margin-top:15px;
      padding:14px;
      border-radius:10px;
      display:none;
      font-size:14px;
      animation:slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error{
      background:rgba(255, 107, 107, 0.15);
      color:#ff6b6b;
      border-left:4px solid #ff6b6b;
    }

    .success{
      background:rgba(141, 177, 155, 0.15);
      color:#56d364;
      border-left:4px solid #56d364;
    }

    .payment-box{
      margin-top:20px;
      background:linear-gradient(135deg, rgba(255, 149, 0, 0.1), rgba(141, 177, 155, 0.1));
      border:2px dashed var(--color-primary);
      border-radius:12px;
      padding:18px;
      line-height:1.9;
      font-size:13px;
    }

    .payment-box h3{
      margin-bottom:12px;
      color:var(--color-primary);
      font-weight:700;
    }

    .payment-box strong{
      color:var(--text);
      display:block;
      margin-top:10px;
    }

    .footer{
      margin-top:25px;
      text-align:center;
      color:var(--text-light);
      font-size:11px;
    }

    .back-link{
      display:block;
      text-align:center;
      margin-top:20px;
      color:var(--text-light);
      text-decoration:none;
      font-size:13px;
      transition:all 0.3s ease;
    }

    .back-link:hover{
      color:var(--color-primary);
    }

    .back-link i{
      margin-left:5px;
    }

    /* RESPONSIVE */

    @media(max-width:480px){
      .container{
        padding:30px;
      }

      .logo h1{
        font-size:28px;
      }

      .field input{
        font-size:16px;
      }

      .tabs button{
        font-size:12px;
      }
    }

  </style>
</head>
<body>

<div class="container">

  <div class="logo">
    <div class="logo-wrapper">
      <img src="./images/logos/logo.png" alt="AMA Logo">
    </div>
    <h1>AMA</h1>
    <p>منصتك التعليمية الذكية</p>
  </div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="switchTab('login')">
      تسجيل الدخول
    </button>

    <button id="signupTab" onclick="switchTab('signup')">
      إنشاء حساب
    </button>
  </div>


  <!-- LOGIN -->

  <div class="card" id="loginCard">
   

    <div class="field">
      <label>اسم المستخدم</label>
      <input id="loginUsername" type="text" placeholder="أدخل اسم المستخدم">
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPassword" type="password" placeholder="أدخل كلمة المرور">
    </div>

    <button class="btn" id="loginBtn" onclick="login()">
      دخول
    </button>

    <div class="message error" id="loginError"></div>

  </div>


  <!-- SIGNUP -->

  <div class="card hidden" id="signupCard">

    <div class="field">
      <label>الاسم الكامل</label>
      <input id="signupNom" type="text" placeholder="أدخل اسمك الكامل">
    </div> 
    
    <div class="field">
      <label>اسم المستخدم</label>
      <input id="signupUsername" type="text" placeholder="اختر اسم مستخدم">
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input id="signupPassword" type="password" placeholder="أنشئ كلمة مرور قوية">
    </div>

    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input id="signupConfirm" type="password" placeholder="أدخل كلمة المرور مجدداً">
    </div>

    <div class="payment-box">

      <h3>💳 معلومات الدفع</h3>

      <p>قم بتحويل <strong>15 درهم</strong> إلى:</p>

      <strong>البنك: ATTIJARI WAFABANK</strong>
      <p>الرقم البنكي: قريباً</p>

      <p style="margin-top:15px;">أو عبر المحافظ الرقمية:</p>
      <strong>CashPlus / WafaCash</strong>
      <p>الرقم: قريباً</p>

      <p style="margin-top:15px; color:var(--text-light); font-size:12px;">
        بعد التحقق من التحويل سيتم تفعيل حسابك مباشرة
      </p>

    </div>

    <button class="btn" id="signupBtn" onclick="signup()">
      إنشاء الحساب
    </button>

    <div class="message error" id="signupError"></div>
    <div class="message success" id="signupSuccess"></div>

  </div>

  <a href="index.html" class="back-link">← العودة للصفحة الرئيسية</a>

  <div class="footer">
    © 2024 AMA Learning Platform | AMAHROUCH AYOUB
  </div>

</div>

<script>

const SUPABASE_URL = "https://pcyklvvyymyvlbrhymzj.supabase.co";
const SUPABASE_KEY = "sb_publishable_JnEOFW-KUOH12hok-N6g-g_bCkGt3AX";


function switchTab(tab){

  const loginCard = document.getElementById('loginCard');
  const signupCard = document.getElementById('signupCard');

  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');

  if(tab === 'login'){

    loginCard.classList.remove('hidden');
    signupCard.classList.add('hidden');

    loginTab.classList.add('active');
    signupTab.classList.remove('active');

  }else{

    signupCard.classList.remove('hidden');
    loginCard.classList.add('hidden');

    signupTab.classList.add('active');
    loginTab.classList.remove('active');

  }

}


function show(id,msg){

  const el = document.getElementById(id);

  el.style.display = 'block';
  el.textContent = msg;

}


function hide(id){

  document.getElementById(id).style.display = 'none';

}


async function signup(){

  hide('signupError');
  hide('signupSuccess');

  const nom = document.getElementById('signupNom').value.trim();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value.trim();
  const confirm = document.getElementById('signupConfirm').value.trim();

  const btn = document.getElementById('signupBtn');

  if(!username || !password || !confirm){

    show('signupError','أكمل جميع الحقول');
    return;

  }

  if(password !== confirm){

    show('signupError','كلمتا المرور غير متطابقتين');
    return;

  }

  btn.disabled = true;
  btn.innerHTML = 'جاري الإنشاء...';

  try{

    // check duplicate

    const check = await fetch(
      `${SUPABASE_URL}/rest/v1/tolab?username=eq.${username}&select=id`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const existing = await check.json();

    if(existing.length > 0){

      show('signupError','اسم المستخدم موجود مسبقاً');

      btn.disabled = false;
      btn.innerHTML = 'إنشاء الحساب';

      return;

    }


    // create account

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/tolab`,
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json',
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`,
          Prefer:'return=representation'
        },

       body:JSON.stringify({

  username: username,

  password: password,

  nom: nom,

  niveau: 'student',

  status: 'pending'

})
      }
    );

  if(!res.ok){

   const errData = await res.json();

   console.log(errData);

   throw new Error(
      errData.message || 'فشل إنشاء الحساب'
   );
}

    show(
      'signupSuccess',
      'تم إنشاء الحساب بنجاح! سيتم التفعيل بعد التحقق من الدفع.'
    );

    // Clear inputs
    document.getElementById('signupNom').value = '';
    document.getElementById('signupUsername').value = '';
    document.getElementById('signupPassword').value = '';
    document.getElementById('signupConfirm').value = '';

  }catch(err){

    show('signupError',err.message);

  }

  btn.disabled = false;
  btn.innerHTML = 'إنشاء الحساب';

}


async function login(){

  hide('loginError');

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();

  const btn = document.getElementById('loginBtn');

  if(!username || !password){

    show('loginError','أدخل اسم المستخدم وكلمة المرور');
    return;

  }

  btn.disabled = true;
  btn.innerHTML = 'جاري التحقق...';

  try{

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/tolab?username=eq.${username}&password=eq.${password}&select=*`,
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:`Bearer ${SUPABASE_KEY}`
        }
      }
    );

    const data = await res.json();

    if(data.length === 0){

      show('loginError','بيانات الدخول خاطئة');

      btn.disabled = false;
      btn.innerHTML = 'دخول';

      return;

    }

    const user = data[0];

    if(user.status !== 'active'){

      show('loginError','الحساب غير مفعل بعد. يرجى التحقق من الدفع.');

      btn.disabled = false;
      btn.innerHTML = 'دخول';

      return;

    }

    localStorage.setItem('taleb',JSON.stringify(user));

    window.location.href = 'dashboard.html';

  }catch(err){

    show('loginError','خطأ في الاتصال. حاول مجدداً.');

  }

  btn.disabled = false;
  btn.innerHTML = 'دخول';

}

</script>

</body>
</html>
